<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini SNS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f3f5f7;
            color: #222;
            font-family: Arial, sans-serif;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 28px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info {
            font-size: 14px;
            color: #555;
        }

        .logout-form {
            margin: 0;
        }

        .logout-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .logout-button:hover {
            background: #444;
        }

        .layout {
            width: min(1100px, calc(100% - 32px));
            margin: 24px auto;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            gap: 24px;
        }

        .card {
            padding: 22px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.04);
        }

        .section-title {
            margin: 0 0 16px;
            font-size: 19px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d5d9df;
            border-radius: 8px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #222;
        }

        .primary-button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
        }

        .primary-button:hover {
            background: #444;
        }

        .secondary-button {
            padding: 8px 12px;
            border: 1px solid #d5d9df;
            border-radius: 8px;
            background: white;
        }

        .secondary-button:hover {
            background: #f7f7f7;
        }

        .danger-button {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            background: #e5484d;
            color: white;
        }

        .danger-button:hover {
            background: #cf383d;
        }

        .post-list {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .post-card {
            padding: 20px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.03);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .post-title {
            margin: 0;
            font-size: 20px;
        }

        .post-meta {
            margin-top: 7px;
            color: #777;
            font-size: 13px;
        }

        .post-content {
            margin: 18px 0;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .like-count {
            font-size: 14px;
            color: #555;
        }

        .like-button.active {
            border-color: #e5484d;
            background: #fff0f1;
            color: #d03035;
        }

        .comments {
            display: none;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid #eceff2;
        }

        .comments.open {
            display: block;
        }

        .comment-form {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .comment-form input {
            flex: 1;
        }

        .comment-item {
            padding: 14px 0;
            border-bottom: 1px solid #eceff2;
        }

        .comment-item:last-child {
            border-bottom: none;
        }

        .comment-meta {
            margin-bottom: 8px;
            font-size: 13px;
            color: #666;
        }

        .comment-content {
            margin: 0 0 10px;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .comment-item .button-row {
            margin-top: 4px;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .side-panel .button-row {
            margin-top: 10px;
        }

        .follow-list {
            margin-top: 14px;
            padding: 0;
            list-style: none;
        }

        .follow-list li {
            padding: 9px 0;
            border-bottom: 1px solid #eceff2;
            font-size: 14px;
        }

        .follow-list li:last-child {
            border-bottom: none;
        }

        .empty-message {
            padding: 24px;
            text-align: center;
            color: #777;
            background: white;
            border-radius: 14px;
        }

        .status-message {
            min-height: 20px;
            margin: 12px 0 0;
            font-size: 14px;
        }

        .comment-status {
            color: #777;
            font-size: 14px;
        }

        @media (max-width: 850px) {
            .header {
                padding: 14px 18px;
            }

            .header-right {
                gap: 10px;
            }

            .user-info {
                text-align: right;
            }

            .layout {
                grid-template-columns: 1fr;
            }

            .side-panel {
                order: -1;
            }
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 20px;
            }

            .user-info {
                display: none;
            }

            .post-header {
                flex-direction: column;
            }

            .comment-form {
                flex-direction: column;
            }

            .comment-form button {
                width: 100%;
            }
        }
    </style>
</head>

<body th:attr="data-user-id=${userId},data-user-email=${email}">

<header class="header">
    <h1>Mini SNS</h1>

    <div class="header-right">
        <div class="user-info">
            <strong th:text="${email}">
                user@example.com
            </strong>

            <span>
                · 사용자 ID
                <span th:text="${userId}">1</span>
            </span>
        </div>

        <form
                th:action="@{/logout}"
                method="post"
                class="logout-form"
        >
            <button
                    type="submit"
                    class="logout-button"
            >
                로그아웃
            </button>
        </form>
    </div>
</header>

<main class="layout">
    <section>
        <div class="card">
            <h2 class="section-title">새 게시글 작성</h2>

            <form id="postForm">
                <div class="form-group">
                    <input
                            type="text"
                            id="postTitle"
                            placeholder="제목을 입력해주세요."
                            required
                    >
                </div>

                <div class="form-group">
                    <textarea
                            id="postContent"
                            placeholder="내용을 입력해주세요."
                            required
                    ></textarea>
                </div>

                <button class="primary-button" type="submit">
                    게시글 등록
                </button>
            </form>

            <p id="postMessage" class="status-message"></p>
        </div>

        <div id="postList" class="post-list">
            <div class="empty-message">
                게시글을 불러오는 중입니다.
            </div>
        </div>
    </section>

    <aside class="side-panel">
        <div class="card">
            <h2 class="section-title">팔로우 관리</h2>

            <input
                    type="number"
                    id="targetUserId"
                    min="1"
                    placeholder="상대방 사용자 ID"
            >

            <div class="button-row">
                <button
                        type="button"
                        class="primary-button"
                        onclick="followUser()"
                >
                    팔로우
                </button>

                <button
                        type="button"
                        class="secondary-button"
                        onclick="unfollowUser()"
                >
                    언팔로우
                </button>
            </div>

            <p id="followMessage" class="status-message"></p>
        </div>

        <div class="card">
            <h2 class="section-title">팔로우 목록 조회</h2>

            <input
                    type="number"
                    id="followListUserId"
                    min="1"
                    placeholder="조회할 사용자 ID"
            >

            <div class="button-row">
                <button
                        type="button"
                        class="secondary-button"
                        onclick="loadFollowers()"
                >
                    팔로워
                </button>

                <button
                        type="button"
                        class="secondary-button"
                        onclick="loadFollowings()"
                >
                    팔로잉
                </button>
            </div>

            <p id="followListMessage" class="status-message"></p>
            <ul id="followList" class="follow-list"></ul>
        </div>
    </aside>
</main>

<script>
    const currentUserId =
        Number(document.body.dataset.userId);

    const postList =
        document.getElementById("postList");

    const postForm =
        document.getElementById("postForm");

    const postMessage =
        document.getElementById("postMessage");

    document.addEventListener(
        "DOMContentLoaded",
        loadPosts
    );

    postForm.addEventListener(
        "submit",
        async (event) => {
            event.preventDefault();

            const title =
                document
                    .getElementById("postTitle")
                    .value
                    .trim();

            const content =
                document
                    .getElementById("postContent")
                    .value
                    .trim();

            if (!title || !content) {
                showMessage(
                    postMessage,
                    "제목과 내용을 입력해주세요.",
                    true
                );

                return;
            }

            try {
                const response =
                    await fetch("/posts", {
                        method: "POST",
                        credentials: "same-origin",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            title,
                            content
                        })
                    });

                if (!response.ok) {
                    showMessage(
                        postMessage,
                        await getErrorMessage(
                            response,
                            "게시글 작성에 실패했습니다."
                        ),
                        true
                    );

                    return;
                }

                postForm.reset();

                showMessage(
                    postMessage,
                    "게시글이 등록되었습니다.",
                    false
                );

                await loadPosts();
            } catch (error) {
                console.error(error);

                showMessage(
                    postMessage,
                    "게시글 작성 중 오류가 발생했습니다.",
                    true
                );
            }
        }
    );

    async function loadPosts() {
        postList.innerHTML =
            '<div class="empty-message">게시글을 불러오는 중입니다.</div>';

        try {
            const response =
                await fetch("/posts", {
                    credentials: "same-origin"
                });

            if (!response.ok) {
                throw new Error(
                    await getErrorMessage(
                        response,
                        "게시글 조회에 실패했습니다."
                    )
                );
            }

            const data = await response.json();
            const posts = normalizeList(data);

            if (posts.length === 0) {
                postList.innerHTML =
                    '<div class="empty-message">등록된 게시글이 없습니다.</div>';

                return;
            }

            postList.innerHTML = "";

            for (const post of posts) {
                const postElement =
                    createPostElement(post);

                postList.appendChild(postElement);

                await loadLikeStatus(post.postId);
            }
        } catch (error) {
            console.error(error);

            postList.innerHTML = `
                <div class="empty-message">
                    ${escapeHtml(error.message)}
                </div>
            `;
        }
    }

    function createPostElement(post) {
        const article =
            document.createElement("article");

        article.className = "post-card";

        const isWriter =
            Number(post.writerId) === currentUserId;

        article.innerHTML = `
            <div class="post-header">
                <div>
                    <h2 class="post-title">
                        ${escapeHtml(post.title)}
                    </h2>

                    <div class="post-meta">
                        작성자 ${escapeHtml(post.writerNickname)}
                        · 사용자 ID ${post.writerId}
                        · ${formatDate(post.createdAt)}
                    </div>
                </div>

                ${isWriter ? `
                    <div class="button-row">
                        <button
                            class="secondary-button"
                            type="button"
                            onclick="updatePost(${post.postId})"
                        >
                            수정
                        </button>

                        <button
                            class="danger-button"
                            type="button"
                            onclick="deletePost(${post.postId})"
                        >
                            삭제
                        </button>
                    </div>
                ` : ""}
            </div>

            <div class="post-content">${escapeHtml(post.content)}</div>

            <div class="button-row">
                <button
                    id="likeButton-${post.postId}"
                    class="secondary-button like-button"
                    type="button"
                    onclick="toggleLike(${post.postId})"
                >
                    좋아요
                </button>

                <button
                    class="secondary-button"
                    type="button"
                    onclick="toggleComments(${post.postId})"
                >
                    댓글 보기
                </button>

                <span
                    id="likeCount-${post.postId}"
                    class="like-count"
                >
                    좋아요 0개
                </span>
            </div>

            <section
                id="comments-${post.postId}"
                class="comments"
            >
                <form class="comment-form">
                    <input
                        id="commentInput-${post.postId}"
                        type="text"
                        placeholder="댓글을 입력해주세요."
                        required
                    >

                    <button
                        class="primary-button"
                        type="submit"
                    >
                        등록
                    </button>
                </form>

                <div
                    id="commentList-${post.postId}"
                    class="comment-status"
                >
                    댓글을 불러오는 중입니다.
                </div>
            </section>
        `;

        const commentForm =
            article.querySelector(".comment-form");

        commentForm.addEventListener(
            "submit",
            async (event) => {
                await createComment(
                    event,
                    post.postId
                );
            }
        );

        return article;
    }

    async function updatePost(postId) {
        try {
            const postResponse =
                await fetch(`/posts/${postId}`, {
                    credentials: "same-origin"
                });

            if (!postResponse.ok) {
                alert(
                    await getErrorMessage(
                        postResponse,
                        "게시글을 불러오지 못했습니다."
                    )
                );

                return;
            }

            const post =
                await postResponse.json();

            const title =
                prompt(
                    "수정할 제목을 입력해주세요.",
                    post.title
                );

            if (title === null) {
                return;
            }

            const content =
                prompt(
                    "수정할 내용을 입력해주세요.",
                    post.content
                );

            if (content === null) {
                return;
            }

            if (!title.trim() || !content.trim()) {
                alert(
                    "제목과 내용을 모두 입력해주세요."
                );

                return;
            }

            const response =
                await fetch(`/posts/${postId}`, {
                    method: "PATCH",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        title: title.trim(),
                        content: content.trim()
                    })
                });

            if (!response.ok) {
                alert(
                    await getErrorMessage(
                        response,
                        "게시글 수정에 실패했습니다."
                    )
                );

                return;
            }

            alert("게시글이 수정되었습니다.");

            await loadPosts();
        } catch (error) {
            console.error(error);

            alert(
                "게시글 수정 중 오류가 발생했습니다."
            );
        }
    }

    async function deletePost(postId) {
        if (!confirm("게시글을 삭제할까요?")) {
            return;
        }

        try {
            const response =
                await fetch(`/posts/${postId}`, {
                    method: "DELETE",
                    credentials: "same-origin"
                });

            if (!response.ok) {
                alert(
                    await getErrorMessage(
                        response,
                        "게시글 삭제에 실패했습니다."
                    )
                );

                return;
            }

            await loadPosts();
        } catch (error) {
            console.error(error);

            alert(
                "게시글 삭제 중 오류가 발생했습니다."
            );
        }
    }

    async function loadLikeStatus(postId) {
        const countElement =
            document.getElementById(
                `likeCount-${postId}`
            );

        const likeButton =
            document.getElementById(
                `likeButton-${postId}`
            );

        if (!countElement || !likeButton) {
            return;
        }

        try {
            const countResponse =
                await fetch(
                    `/posts/${postId}/likes/count`,
                    {
                        credentials: "same-origin"
                    }
                );

            if (countResponse.ok) {
                const countData =
                    await countResponse.json();

                countElement.textContent =
                    `좋아요 ${countData.likeCount}개`;
            }

            const myLikeResponse =
                await fetch(
                    `/posts/${postId}/likes/me`,
                    {
                        credentials: "same-origin"
                    }
                );

            if (myLikeResponse.ok) {
                likeButton.classList.add("active");
                likeButton.textContent =
                    "좋아요 취소";
            } else {
                likeButton.classList.remove("active");
                likeButton.textContent =
                    "좋아요";
            }
        } catch (error) {
            console.error(error);
        }
    }

    async function toggleLike(postId) {
        const likeButton =
            document.getElementById(
                `likeButton-${postId}`
            );

        if (!likeButton) {
            return;
        }

        const isLiked =
            likeButton.classList.contains("active");

        try {
            let response;

            if (isLiked) {
                response =
                    await fetch(
                        `/posts/${postId}/likes/me`,
                        {
                            method: "DELETE",
                            credentials: "same-origin"
                        }
                    );
            } else {
                response =
                    await fetch("/likes", {
                        method: "POST",
                        credentials: "same-origin",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            postId
                        })
                    });
            }

            if (!response.ok) {
                alert(
                    await getErrorMessage(
                        response,
                        "좋아요 처리에 실패했습니다."
                    )
                );

                return;
            }

            await loadLikeStatus(postId);
        } catch (error) {
            console.error(error);

            alert(
                "좋아요 처리 중 오류가 발생했습니다."
            );
        }
    }

    async function toggleComments(postId) {
        const commentsSection =
            document.getElementById(
                `comments-${postId}`
            );

        if (!commentsSection) {
            return;
        }

        commentsSection.classList.toggle("open");

        if (
            commentsSection.classList.contains("open")
        ) {
            await loadComments(postId);
        }
    }

    async function loadComments(postId) {
        const commentList =
            document.getElementById(
                `commentList-${postId}`
            );

        if (!commentList) {
            return;
        }

        commentList.className =
            "comment-status";

        commentList.textContent =
            "댓글을 불러오는 중입니다.";

        try {
            const response =
                await fetch(
                    `/posts/${postId}/comments`,
                    {
                        credentials: "same-origin"
                    }
                );

            if (!response.ok) {
                commentList.textContent =
                    await getErrorMessage(
                        response,
                        "댓글 조회에 실패했습니다."
                    );

                return;
            }

            const data =
                await response.json();

            const comments =
                normalizeList(data);

            if (comments.length === 0) {
                commentList.textContent =
                    "등록된 댓글이 없습니다.";

                return;
            }

            commentList.className = "";

            commentList.innerHTML =
                comments.map(comment => {
                    const isWriter =
                        Number(comment.writerId) ===
                        currentUserId;

                    return `
                        <div class="comment-item">
                            <div class="comment-meta">
                                ${escapeHtml(comment.writerNickname)}
                                · 사용자 ID ${comment.writerId}
                                · ${formatDate(comment.createdAt)}
                            </div>

                            <div class="comment-content">${escapeHtml(comment.content)}</div>

                            ${isWriter ? `
                                <div class="button-row">
                                    <button
                                        class="secondary-button"
                                        type="button"
                                        onclick="updateComment(${comment.commentId}, ${postId})"
                                    >
                                        수정
                                    </button>

                                    <button
                                        class="danger-button"
                                        type="button"
                                        onclick="deleteComment(${comment.commentId}, ${postId})"
                                    >
                                        삭제
                                    </button>
                                </div>
                            ` : ""}
                        </div>
                    `;
                }).join("");
        } catch (error) {
            console.error(error);

            commentList.textContent =
                "댓글 조회 중 오류가 발생했습니다.";
        }
    }

    async function createComment(event, postId) {
        event.preventDefault();

        const input =
            document.getElementById(
                `commentInput-${postId}`
            );

        if (!input) {
            alert("댓글 입력창을 찾지 못했습니다.");
            return;
        }

        const content =
            input.value.trim();

        if (!content) {
            alert(
                "댓글 내용을 입력해주세요."
            );

            return;
        }

        try {
            const response =
                await fetch("/comments", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        postId,
                        content
                    })
                });

            if (!response.ok) {
                alert(
                    await getErrorMessage(
                        response,
                        "댓글 작성에 실패했습니다."
                    )
                );

                return;
            }

            input.value = "";

            await loadComments(postId);
        } catch (error) {
            console.error(error);

            alert(
                "댓글 작성 중 오류가 발생했습니다."
            );
        }
    }

    async function updateComment(
        commentId,
        postId
    ) {
        try {
            const commentResponse =
                await fetch(
                    `/comments/${commentId}`,
                    {
                        credentials: "same-origin"
                    }
                );

            if (!commentResponse.ok) {
                alert(
                    await getErrorMessage(
                        commentResponse,
                        "댓글을 불러오지 못했습니다."
                    )
                );

                return;
            }

            const comment =
                await commentResponse.json();

            const content =
                prompt(
                    "수정할 댓글 내용을 입력해주세요.",
                    comment.content
                );

            if (content === null) {
                return;
            }

            if (!content.trim()) {
                alert(
                    "댓글 내용을 입력해주세요."
                );

                return;
            }

            const response =
                await fetch(
                    `/comments/${commentId}`,
                    {
                        method: "PATCH",
                        credentials: "same-origin",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            content: content.trim()
                        })
                    }
                );

            if (!response.ok) {
                alert(
                    await getErrorMessage(
                        response,
                        "댓글 수정에 실패했습니다."
                    )
                );

                return;
            }

            await loadComments(postId);
        } catch (error) {
            console.error(error);

            alert(
                "댓글 수정 중 오류가 발생했습니다."
            );
        }
    }

    async function deleteComment(
        commentId,

        if (!confirm("댓글을 삭제할까요?")) {

    }

    async function loadFollowers() {
        await loadFollowList("followers");
    }

    async function loadFollowings() {

    async function loadFollowList(type) {
        const userId =
            Number(
                document
                    .getElementById("followListUserId")
                    .value
            );

        const message =
            document.getElementById(
                "followListMessage"
            );

        const list =
            document.getElementById(
                "followList"
            );

        if (!userId) {
            showMessage(
                message,
                "조회할 사용자 ID를 입력해주세요.",
                true
            );

            list.innerHTML = "";

            return;
        }

        try {
            const response =
                await fetch(
                    `/follows/${userId}/${type}`,
                    {
                        credentials: "same-origin"
                    }
                );

            if (!response.ok) {
                showMessage(
                    message,
                    await getErrorMessage(
                        response,
                        "목록 조회에 실패했습니다."
                    ),
                    true
                );

                list.innerHTML = "";

                return;
            }

            const data =
                await response.json();

            const users =
                data.data || [];

            showMessage(
                message,
                `${data.message || "조회 완료"} · ${data.count}명`,
                false
            );

            if (users.length === 0) {
                list.innerHTML =
                    "<li>목록이 비어 있습니다.</li>";

                return;
            }

            list.innerHTML =
                users.map(user => `
                    <li>
                        ${escapeHtml(user.nickname)}
                        · 사용자 ID ${user.userId}
                    </li>
                `).join("");
        } catch (error) {
            console.error(error);

            showMessage(
                message,
                "목록 조회 중 오류가 발생했습니다.",
                true
            );

            list.innerHTML = "";
        }
    }

    function normalizeList(data) {
        if (Array.isArray(data)) {
            return data;
        }

        if (
            data &&
            Array.isArray(data.content)
        ) {
            return data.content;
        }

        if (
            data &&
            Array.isArray(data.data)
        ) {
            return data.data;
        }

        return [];
    }

    async function getErrorMessage(
        response,
        defaultMessage
    ) {
        try {
            const contentType =
                response.headers.get(
                    "content-type"
                );

            if (
                contentType &&
                contentType.includes(
                    "application/json"
                )
            ) {
                const errorData =
                    await response.json();

                return (
                    errorData.message ||
                    errorData.error ||
                    defaultMessage
                );
            }

            const text =
                await response.text();

            return text || defaultMessage;
        } catch (error) {
            return defaultMessage;
        }
    }

    function showMessage(
        element,
        text,
        isError
    ) {
        element.textContent = text;

        element.style.color =
            isError
                ? "#d03035"
                : "#16803c";
    }

    function formatDate(value) {
        if (!value) {
            return "";
        }

        return new Date(value)
            .toLocaleString("ko-KR");
    }

    function escapeHtml(value) {
        if (
            value === null ||
            value === undefined
        ) {
            return "";
        }

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }
