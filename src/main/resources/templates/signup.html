<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNS 회원가입</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f8;
            font-family: Arial, sans-serif;
        }

        .signup-box {
            width: 360px;
            padding: 32px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 24px;
            text-align: center;
            font-size: 28px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d7dce1;
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #222;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #message {
            min-height: 20px;
            margin-top: 14px;
            text-align: center;
            font-size: 14px;
        }

        .login-link {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }

        .login-link a {
            color: #3366cc;
            text-decoration: none;
        }
    </style>
</head>

<body>
<div class="signup-box">
    <h1>회원가입</h1>

    <form id="signupForm">
        <div class="field">
            <label for="email">이메일</label>
            <input
                    type="email"
                    id="email"
                    placeholder="이메일을 입력해주세요."
                    required
            >
        </div>

        <div class="field">
            <label for="nickname">닉네임</label>
            <input
                    type="text"
                    id="nickname"
                    placeholder="닉네임을 입력해주세요."
                    required
            >
        </div>

        <div class="field">
            <label for="password">비밀번호</label>
            <input
                    type="password"
                    id="password"
                    placeholder="비밀번호를 입력해주세요."
                    required
            >
        </div>

        <button type="submit">가입하기</button>
    </form>

    <p id="message"></p>

    <div class="login-link">
        이미 계정이 있으신가요?
        <a href="/login">로그인</a>
    </div>
</div>

<script>
    const signupForm = document.getElementById("signupForm");
    const message = document.getElementById("message");

    signupForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const nickname = document.getElementById("nickname").value.trim();
        const password = document.getElementById("password").value;

        message.textContent = "";

        try {
            const response = await fetch("/users", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email,
                    nickname,
                    password
                })
            });

            if (response.ok) {
                alert("회원가입이 완료되었습니다.");
                window.location.href = "/login";
                return;
            }

            let errorMessage = "회원가입에 실패했습니다.";

            try {
                const errorData = await response.json();

                if (errorData.message) {
                    errorMessage = errorData.message;
                }
            } catch (error) {
                console.error("오류 응답을 읽지 못했습니다.", error);
            }

            message.textContent = errorMessage;
            message.style.color = "red";
        } catch (error) {
            console.error(error);

            message.textContent = "서버와 통신할 수 없습니다.";
            message.style.color = "red";
        }
    });
</script>
</body>
</html>
